# Netlify deployment (free tier allows commercial use, unlike Vercel Hobby).
# Site settings → set env vars: DATABASE_URL, ADMIN_SECRET, NEXT_PUBLIC_SITE_URL,
# NEXT_PUBLIC_GA_ID. The Next.js runtime plugin is auto-detected, declared here
# explicitly for reproducibility.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
